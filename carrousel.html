<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body body class="bg-light text-dark">
    <div class="container text-center">
    <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="./img/bo2zombies.jpg" class="d-block w-100" alt="...">
                <div class="carousel-caption">
                    <h5>Black Ops 2 Zombies</h5>
                </div>
            </div>
            <div class="carousel-item">
                <img src="./img/bocwzombies.webp" class="d-block w-100" alt="...">
                <div class="carousel-caption">
                    <h5>Black Ops Cold War Zombies</h5>
                </div>
            </div>
            <div class="carousel-item">
                <img src="./img/codspacelandzombies.jpg" class="d-block w-100" alt="...">
                <div class="carousel-caption">
                    <h5>Zombies in Spaceland</h5>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    </div>
</body>
</html>
